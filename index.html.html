<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MerchTrack</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f172a;--panel:#1e293b;--border:#334155;--muted:#64748b;
  --text:#f1f5f9;--sub:#94a3b8;
  --cyan:#06b6d4;--green:#10b981;--amber:#f59e0b;--orange:#fb923c;
  --red:#ef4444;--purple:#a78bfa;--blue:#93c5fd;
  --green-dim:#064e3b;--green-txt:#6ee7b7;
  --amber-dim:#78350f;--amber-txt:#fde68a;
  --red-dim:#7f1d1d;--red-txt:#fca5a5;
}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;font-size:14px;min-height:100vh}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
input,select,textarea{background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:7px 10px;font-size:13px;outline:none;width:100%;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--cyan)}
button{cursor:pointer;font-family:inherit;border:none}
table{width:100%;border-collapse:collapse}
th{padding:8px 10px;font-size:11px;font-weight:700;color:var(--muted);text-align:left;white-space:nowrap}
td{padding:8px 10px;font-size:13px;vertical-align:middle}
tr.data-row:hover td{background:var(--panel)}
tfoot td{font-weight:700}

/* layout */
#app{display:flex;flex-direction:column;min-height:100vh}
#header{background:var(--panel);border-bottom:1px solid var(--border);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
#header h1{font-size:17px;font-weight:800;color:var(--cyan);letter-spacing:-.5px}
#header .sub{font-size:11px;color:var(--muted)}
#tabbar{background:var(--panel);border-bottom:1px solid var(--border);display:flex;overflow-x:auto}
.tab-btn{padding:11px 16px;background:none;border:none;color:var(--muted);font-weight:500;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s}
.tab-btn.active{color:var(--cyan);font-weight:700;border-bottom-color:var(--cyan)}
#body{padding:14px;max-width:1400px;margin:0 auto;width:100%}

/* cards */
.card{background:var(--panel);border-radius:10px;padding:16px}
.sec-title{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}
.stat-card{background:var(--panel);border-radius:8px;padding:14px 16px}
.stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.stat-value{font-size:20px;font-weight:800}
.stat-sub{font-size:11px;color:var(--muted);margin-top:2px}

/* tags */
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:700}
.tag-direct{background:var(--green-dim);color:var(--green-txt)}
.tag-consignment{background:var(--amber-dim);color:var(--amber-txt)}
.tag-retail{background:#2d1b4e;color:#c4b5fd}
.tag-wholesale{background:#1e3a5f;color:var(--blue)}
.tag-in{background:#1e3a5f;color:var(--blue)}
.tag-out{background:#3f0f0f;color:var(--red-txt)}
.tag-adjust{background:#2d1b4e;color:#c4b5fd}
.tag-return{background:#1a2e1a;color:#86efac}
.tag-con-out{background:#4a2000;color:var(--orange)}
.tag-con-sold{background:#3f0f0f;color:#f87171}
.tag-con-return{background:#14532d;color:#4ade80}

/* gp color */
.gp-hi{color:#6ee7b7} .gp-mid{color:#fde68a} .gp-lo{color:#fca5a5}

/* grid helpers */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.g4{grid-template-columns:repeat(4,1fr)}
.g-auto{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.g-auto2{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}

/* btns */
.btn{padding:7px 14px;border-radius:6px;font-size:13px;font-weight:600;transition:opacity .15s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--cyan);color:#fff}
.btn-success{background:var(--green-dim);color:var(--green-txt)}
.btn-warn{background:var(--amber-dim);color:var(--amber-txt)}
.btn-ghost{background:transparent;color:var(--sub);border:1px solid var(--border)}
.btn-danger{background:var(--red-dim);color:var(--red-txt)}
.btn-purple{background:#2d1b4e;color:#c4b5fd}
.btn-sm{padding:5px 10px;font-size:12px}

/* pills */
.pill{padding:4px 13px;border-radius:20px;font-size:12px;font-weight:600;border:none;transition:all .15s}
.pill.active{background:var(--cyan);color:#fff}
.pill.inactive{background:var(--panel);color:var(--sub)}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px}
.modal-box{background:var(--panel);border-radius:12px;width:100%;max-width:560px;max-height:93vh;overflow-y:auto;padding:24px}
.modal-box.wide{max-width:860px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-title{font-weight:700;font-size:15px}
.modal-close{background:none;border:none;color:var(--muted);font-size:24px;line-height:1}

/* form */
.form-row{display:grid;gap:10px;margin-bottom:10px}
.lbl{display:block;font-size:10px;color:var(--muted);margin-bottom:4px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}

/* overview box */
.info-box{background:var(--bg);border-radius:8px;padding:12px}

/* sync dot */
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}

/* drop zone */
.dz{border:2px dashed var(--border);border-radius:10px;padding:28px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s}
.dz:hover,.dz.drag{border-color:var(--cyan);background:#06b6d411}

/* pie */
.pie-wrap{display:flex;gap:14px;align-items:center}
.legend{display:grid;gap:4px}
.legend-row{display:flex;align-items:center;gap:7px;font-size:11px}
.legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}

/* date-range presets */
.preset-bar{display:flex;gap:5px;flex-wrap:wrap}
.preset-btn{padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;border:none;transition:all .15s}
.preset-btn.active{background:var(--cyan);color:#fff}
.preset-btn.inactive{background:var(--bg);color:var(--sub)}

/* number badge */
.badge{background:var(--bg);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--sub)}

/* export dropdown */
.export-drop{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px;min-width:220px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.export-item{display:block;width:100%;text-align:left;background:none;border:none;padding:9px 12px;border-radius:6px;color:var(--text);font-size:13px}
.export-item:hover{background:var(--border)}
.export-item .ei-sub{font-size:11px;color:var(--muted);margin-top:1px}

/* movement desc box */
.mv-desc{border-radius:7px;padding:8px 12px;font-size:12px}

/* scrollable preview */
.scroll-preview{overflow-x:auto;max-height:260px;overflow-y:auto;border-radius:8px;border:1px solid var(--border)}

/* bar chart row */
.bar-bg{height:4px;background:var(--bg);border-radius:2px;margin-top:3px;max-width:160px}
.bar-fill{height:4px;background:var(--cyan);border-radius:2px;transition:width .3s}

/* stock status colors */
.st-ok{color:#6ee7b7} .st-low{color:#fde68a} .st-crit{color:#fca5a5}

@media(max-width:600px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  #header{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div>
      <h1>📋 MerchTrack</h1>
      <div class="sub">Sales Credit &amp; Consignment System</div>
    </div>
    <div id="sync-bar"></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap" id="header-btns"></div>
  </div>
  <div id="tabbar"></div>
  <div id="body"></div>
</div>

<!-- MODAL -->
<div id="modal-overlay" class="modal-overlay" style="display:none">
  <div id="modal-box" class="modal-box">
    <div class="modal-head">
      <div id="modal-title" class="modal-title"></div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   DATA & STATE
═══════════════════════════════════════════ */
const state = {
  tab: 0,
  sales: [
    {id:"S001",date:"2025-06-01",product:"P001",productName:"Moisturizer SPF50",    type:"Direct Sale", salesType:"Retail",   qty:50,costPrice:120,sellingPrice:250,discount:0, licenseeFee:0,gpOverride:null,channel:"Shopee",      ref:"INV-001",note:""},
    {id:"S002",date:"2025-06-03",product:"P002",productName:"Vitamin C Serum 30ml",type:"Consignment", salesType:"Wholesale",qty:30,costPrice:180,sellingPrice:420,discount:5, licenseeFee:8,gpOverride:52,  channel:"Watson",      ref:"CON-001",note:""},
    {id:"S003",date:"2025-06-05",product:"P003",productName:"Collagen Night Cream",type:"Direct Sale", salesType:"Retail",   qty:20,costPrice:200,sellingPrice:490,discount:0, licenseeFee:0,gpOverride:null,channel:"LINE OA",     ref:"INV-002",note:""},
    {id:"S004",date:"2025-06-10",product:"P004",productName:"Sunscreen Spray 150ml",type:"Consignment",salesType:"Wholesale",qty:60,costPrice:95, sellingPrice:200,discount:10,licenseeFee:6,gpOverride:44,  channel:"Boots",       ref:"CON-002",note:""},
    {id:"S005",date:"2025-06-12",product:"P001",productName:"Moisturizer SPF50",    type:"Consignment",salesType:"Retail",   qty:40,costPrice:120,sellingPrice:260,discount:0, licenseeFee:5,gpOverride:48,  channel:"Central Dept",ref:"CON-003",note:""},
  ],
  stock: [
    {id:"M001",date:"2025-05-28",product:"P001",productName:"Moisturizer SPF50",    movement:"IN",        qty:200,ref:"PO-001",note:"Opening stock",periodEnd:""},
    {id:"M002",date:"2025-06-01",product:"P001",productName:"Moisturizer SPF50",    movement:"OUT",       qty:50, ref:"S001",  note:"Direct sale",periodEnd:""},
    {id:"M003",date:"2025-05-28",product:"P002",productName:"Vitamin C Serum 30ml",movement:"IN",        qty:150,ref:"PO-001",note:"Opening stock",periodEnd:""},
    {id:"M004",date:"2025-06-03",product:"P002",productName:"Vitamin C Serum 30ml",movement:"CON-OUT",   qty:30, ref:"CON-001",note:"Watson shelf",periodEnd:"2025-07-03"},
    {id:"M005",date:"2025-06-03",product:"P003",productName:"Collagen Night Cream",movement:"IN",        qty:100,ref:"PO-002",note:"New stock",periodEnd:""},
    {id:"M006",date:"2025-06-05",product:"P003",productName:"Collagen Night Cream",movement:"OUT",       qty:20, ref:"S003",  note:"Direct sale",periodEnd:""},
  ],
  products: [
    {id:"P001",name:"Moisturizer SPF50",    sku:"SKU-001",unit:"box",   costPrice:120,sellingPrice:250,imageUrl:""},
    {id:"P002",name:"Vitamin C Serum 30ml", sku:"SKU-002",unit:"bottle",costPrice:180,sellingPrice:420,imageUrl:""},
    {id:"P003",name:"Collagen Night Cream", sku:"SKU-003",unit:"jar",   costPrice:200,sellingPrice:490,imageUrl:""},
    {id:"P004",name:"Sunscreen Spray 150ml",sku:"SKU-004",unit:"can",   costPrice:95, sellingPrice:200,imageUrl:""},
  ],
  sf: {type:"",salesType:"",channel:"",product:"",from:"",to:""},
  mf: {movement:"",product:""},
  dPreset:"all", dFrom:"", dTo:"", dChannel:"",
  hover: null,
  gsUrl: localStorage.getItem("mt_gs_url")||"",
  gsStatus:"idle", gsMsg:"",
  showExport: false,
  editSaleId: null,
  editProdId: null,
};

/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
const fmtB   = n => "฿"+Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2});
const fmtPct = n => Number(n||0).toFixed(2)+"%";
const fmtNum = n => Number(n||0).toLocaleString("en-US");
const todayStr = () => new Date().toISOString().slice(0,10);
const uid = (prefix,arr) => prefix+String(arr.length+1).padStart(3,"0");
const escH = s => String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

const prodImg = (productId, size=36) => {
  const p = state.products.find(x=>x.id===productId);
  if(p && p.imageUrl) return `<img src="${p.imageUrl}" style="width:${size}px;height:${size}px;object-fit:cover;border-radius:5px;display:block;flex-shrink:0" onerror="this.style.display='none'">`;
  return `<div style="width:${size}px;height:${size}px;border-radius:5px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:${Math.round(size*.45)}px;flex-shrink:0">📦</div>`;
};

const netSell = r => Number(r.sellingPrice)*(1-(Number(r.discount)||0)/100);
const licFee  = r => netSell(r)*(Number(r.licenseeFee)||0)/100;
const calcGP  = r => {
  if(r.gpOverride!=null&&r.gpOverride!=="") return Number(r.gpOverride);
  const ns=netSell(r), lf=licFee(r);
  if(!ns) return 0;
  return ((ns-Number(r.costPrice)-lf)/ns)*100;
};
const gpAmt = r => (netSell(r)-Number(r.costPrice)-licFee(r))*Number(r.qty);
const gpClrClass = v => v>=40?"gp-hi":v>=25?"gp-mid":"gp-lo";

const MV_IN  = mv=>["IN","RETURN","CON-RETURN"].includes(mv);
const MV_OUT = mv=>["OUT","CON-OUT","CON-SOLD"].includes(mv);
const MV_TYPES_REG = ["IN","OUT","RETURN","ADJUST"];
const MV_TYPES_CON = ["CON-OUT","CON-SOLD","CON-RETURN"];
const MV_ALL = [...MV_TYPES_REG,...MV_TYPES_CON];
const MV_DESC = {
  "IN":"Stock received into warehouse",
  "OUT":"Stock sold/removed (direct sale)",
  "RETURN":"Customer return — direct sale",
  "ADJUST":"Manual stock adjustment",
  "CON-OUT":"Sent to consignee shelf (period starts)",
  "CON-SOLD":"Confirmed sold by consignee",
  "CON-RETURN":"Unsold goods returned at period end",
};

function tagClass(mv){
  const map={"Direct Sale":"direct","Consignment":"consignment","Retail":"retail","Wholesale":"wholesale",
    "IN":"in","OUT":"out","ADJUST":"adjust","RETURN":"return","CON-OUT":"con-out","CON-SOLD":"con-sold","CON-RETURN":"con-return"};
  return "tag tag-"+(map[mv]||"in");
}

/* date range */
const PRESETS=[
  {key:"all",label:"All"},{key:"today",label:"Today"},{key:"week",label:"This Week"},
  {key:"month",label:"This Month"},{key:"lastmonth",label:"Last Month"},
  {key:"q1",label:"Q1"},{key:"q2",label:"Q2"},{key:"q3",label:"Q3"},{key:"q4",label:"Q4"},
  {key:"year",label:"This Year"},{key:"custom",label:"Custom ✏️"},
];
function getRange(key){
  const now=new Date(),pad=n=>String(n).padStart(2,"0"),fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  switch(key){
    case "today": return{from:fmt(now),to:fmt(now)};
    case "week":{const m=new Date(now);m.setDate(now.getDate()-now.getDay()+1);return{from:fmt(m),to:fmt(now)};}
    case "month": return{from:fmt(new Date(now.getFullYear(),now.getMonth(),1)),to:fmt(now)};
    case "lastmonth":{const f=new Date(now.getFullYear(),now.getMonth()-1,1),t=new Date(now.getFullYear(),now.getMonth(),0);return{from:fmt(f),to:fmt(t)};}
    case "q1":return{from:`${now.getFullYear()}-01-01`,to:`${now.getFullYear()}-03-31`};
    case "q2":return{from:`${now.getFullYear()}-04-01`,to:`${now.getFullYear()}-06-30`};
    case "q3":return{from:`${now.getFullYear()}-07-01`,to:`${now.getFullYear()}-09-30`};
    case "q4":return{from:`${now.getFullYear()}-10-01`,to:`${now.getFullYear()}-12-31`};
    case "year":return{from:`${now.getFullYear()}-01-01`,to:`${now.getFullYear()}-12-31`};
    default:return{from:"",to:""};
  }
}

/* stock balance */
function computeBalance(){
  const wh={},con={};
  state.products.forEach(p=>{wh[p.id]=0;con[p.id]=0;});
  state.stock.forEach(m=>{
    if(MV_IN(m.movement))  wh[m.product]=(wh[m.product]||0)+Number(m.qty);
    if(MV_OUT(m.movement)) wh[m.product]=(wh[m.product]||0)-Number(m.qty);
    if(m.movement==="CON-OUT")    con[m.product]=(con[m.product]||0)+Number(m.qty);
    if(m.movement==="CON-SOLD"||m.movement==="CON-RETURN") con[m.product]=(con[m.product]||0)-Number(m.qty);
  });
  return{wh,con};
}

/* filter sales */
function filteredSales(sf){
  return state.sales.filter(s=>{
    if(sf.type     &&s.type!==sf.type) return false;
    if(sf.salesType&&(s.salesType||"Retail")!==sf.salesType) return false;
    if(sf.channel  &&!s.channel.toLowerCase().includes(sf.channel.toLowerCase())) return false;
    if(sf.product  &&s.product!==sf.product) return false;
    if(sf.from     &&s.date<sf.from) return false;
    if(sf.to       &&s.date>sf.to)   return false;
    return true;
  });
}

/* date stats for filtered sales */
function dateStats(rows){
  if(!rows.length) return{days:0,uniqueDates:0,avgRevPerDay:0,avgGPPerDay:0,firstDate:"",lastDate:""};
  const dates=[...new Set(rows.map(r=>r.date))].sort();
  const first=dates[0],last=dates[dates.length-1];
  const rangeDays=first&&last?Math.max(1,Math.round((new Date(last)-new Date(first))/(864e5))+1):1;
  const totRev=rows.reduce((a,r)=>a+netSell(r)*r.qty,0);
  const totGP=rows.reduce((a,r)=>a+gpAmt(r),0);
  return{
    days:rangeDays,
    uniqueDates:dates.length,
    avgRevPerDay:totRev/rangeDays,
    avgGPPerDay:totGP/rangeDays,
    firstDate:first,lastDate:last
  };
}

/* CSV parse */
function parseCSV(text){
  const lines=text.trim().split(/\r?\n/);
  const headers=lines[0].split(",").map(h=>h.trim().toLowerCase().replace(/\s+/g,"_").replace(/[^a-z0-9_]/g,""));
  return lines.slice(1).filter(l=>l.trim()).map(line=>{
    const vals=line.split(",").map(v=>v.trim().replace(/^"|"$/g,""));
    const obj={};headers.forEach((h,i)=>{obj[h]=vals[i]||"";});return obj;
  });
}

/* ═══════════════════════════════════════════
   PIE CHART (SVG)
═══════════════════════════════════════════ */
const PIE_COLORS=["#06b6d4","#10b981","#f59e0b","#a78bfa","#fb923c","#f43f5e","#22d3ee","#84cc16","#ec4899","#3b82f6"];
function buildPie(slices,size=130){
  if(!slices||!slices.length) return "";
  const total=slices.reduce((a,s)=>a+s.value,0);
  if(!total) return "";
  let angle=-Math.PI/2;
  const cx=size/2,cy=size/2,r=size*.42,ir=size*.22;
  const paths=slices.map((s,i)=>{
    const sweep=(s.value/total)*2*Math.PI;
    const x1=cx+r*Math.cos(angle),y1=cy+r*Math.sin(angle);
    angle+=sweep;
    const x2=cx+r*Math.cos(angle),y2=cy+r*Math.sin(angle);
    const ix1=cx+ir*Math.cos(angle-sweep),iy1=cy+ir*Math.sin(angle-sweep);
    const ix2=cx+ir*Math.cos(angle),iy2=cy+ir*Math.sin(angle);
    const lg=sweep>Math.PI?1:0;
    return `<path d="M${x1},${y1} A${r},${r} 0 ${lg},1 ${x2},${y2} L${ix2},${iy2} A${ir},${ir} 0 ${lg},0 ${ix1},${iy1} Z" fill="${s.color}" stroke="#0f172a" stroke-width="1.5" opacity=".92"/>`;
  }).join("");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}</svg>`;
}
function buildLegend(slices){
  const total=slices.reduce((a,s)=>a+s.value,0);
  return slices.map(s=>`
    <div class="legend-row">
      <span class="legend-dot" style="background:${s.color}"></span>
      <span style="color:var(--sub);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escH(s.label)}</span>
      <span style="color:var(--text);font-weight:700;font-family:monospace">${total>0?Math.round(s.value/total*100):0}%</span>
    </div>`).join("");
}

/* ═══════════════════════════════════════════
   RENDER ENGINE
═══════════════════════════════════════════ */
function render(){
  renderHeader();
  renderTabBar();
  renderBody();
}

function renderHeader(){
  // sync bar
  const sb=document.getElementById("sync-bar");
  if(state.gsUrl){
    const dotClr=state.gsStatus==="ok"?"#10b981":state.gsStatus==="error"?"#ef4444":state.gsStatus==="loading"||state.gsStatus==="saving"?"#f59e0b":"#64748b";
    const msg=state.gsStatus==="loading"?"Loading…":state.gsStatus==="saving"?"Saving…":state.gsStatus==="error"?"⚠ "+state.gsMsg:state.gsStatus==="ok"?"Synced "+state.gsMsg:"";
    sb.innerHTML=`<div style="display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:6px;padding:4px 10px;font-size:11px">
      <span class="dot" style="background:${dotClr}"></span>
      <span style="color:var(--sub)">${escH(msg)}</span>
      <span style="cursor:pointer;color:var(--cyan)" onclick="loadFromSheets()">↺</span>
    </div>`;
  } else sb.innerHTML="";

  // header buttons
  document.getElementById("header-btns").innerHTML=`
    <button class="btn btn-${state.gsUrl?"ghost":"warn"} btn-sm" onclick="openModal('sheets')">${state.gsUrl?"⚙️ Sheets":"🔌 Connect Sheets"}</button>
    <button class="btn btn-success btn-sm" onclick="openModal('sale')">+ Add Sale</button>
    <button class="btn btn-ghost btn-sm" onclick="openModal('stock')">+ Stock</button>
    <button class="btn btn-warn btn-sm" onclick="openModal('bulk')">⬆️ Bulk Import</button>`;
}

const TABS=["📊 Dashboard","🛒 Sales","📦 Stock Movement","🗂 Master Data"];
function renderTabBar(){
  document.getElementById("tabbar").innerHTML=TABS.map((t,i)=>
    `<button class="tab-btn${state.tab===i?" active":""}" onclick="setTab(${i})">${t}</button>`
  ).join("");
}

function renderBody(){
  const el=document.getElementById("body");
  if(state.tab===0) el.innerHTML=renderDashboard();
  else if(state.tab===1) el.innerHTML=renderSales();
  else if(state.tab===2) el.innerHTML=renderStock();
  else el.innerHTML=renderMaster();
  attachBodyEvents();
}

/* ═══════════════════════════════════════════
   DASHBOARD
═══════════════════════════════════════════ */
function renderDashboard(){
  const sf={from:state.dFrom,to:state.dTo};
  const allChannels=[...new Set(state.sales.map(s=>s.channel))].sort();
  const dSales=state.sales.filter(s=>{
    if(sf.from&&s.date<sf.from) return false;
    if(sf.to  &&s.date>sf.to)   return false;
    if(state.dChannel&&s.channel!==state.dChannel) return false;
    return true;
  });
  const {wh,con}=computeBalance();
  const dirS=dSales.filter(s=>s.type==="Direct Sale");
  const conS=dSales.filter(s=>s.type==="Consignment");
  const retS=dSales.filter(s=>(s.salesType||"Retail")==="Retail");
  const whoS=dSales.filter(s=>(s.salesType||"Retail")==="Wholesale");
  const totRev=dSales.reduce((a,s)=>a+netSell(s)*s.qty,0);
  const totGP =dSales.reduce((a,s)=>a+gpAmt(s),0);
  const totDisc=dSales.reduce((a,s)=>a+(s.sellingPrice-netSell(s))*s.qty,0);
  const totLic=dSales.reduce((a,s)=>a+licFee(s)*s.qty,0);
  const avgGP=totRev?(totGP/totRev)*100:0;
  const noData=dSales.length===0;

  // date stats
  const ds=dateStats(dSales);

  // stock value
  const totUnits=state.products.reduce((a,p)=>a+Math.max(0,wh[p.id]||0),0);
  const totCostVal=state.products.reduce((a,p)=>a+Math.max(0,wh[p.id]||0)*Number(p.costPrice||0),0);
  const totRetailVal=state.products.reduce((a,p)=>a+Math.max(0,wh[p.id]||0)*Number(p.sellingPrice||0),0);
  const totConUnits=state.products.reduce((a,p)=>a+Math.max(0,con[p.id]||0),0);

  // by channel
  const chMap={};
  dSales.forEach(s=>{
    if(!chMap[s.channel])chMap[s.channel]={rev:0,gp:0,disc:0,lic:0};
    chMap[s.channel].rev+=netSell(s)*s.qty;
    chMap[s.channel].gp+=gpAmt(s);
    chMap[s.channel].disc+=(s.sellingPrice-netSell(s))*s.qty;
    chMap[s.channel].lic+=licFee(s)*s.qty;
  });
  const byCh=Object.entries(chMap).map(([ch,d])=>({ch,...d,gpPct:d.rev?(d.gp/d.rev)*100:0})).sort((a,b)=>b.rev-a.rev);

  // product ranking
  const prodMap={};
  dSales.forEach(s=>{
    if(!prodMap[s.product])prodMap[s.product]={id:s.product,name:s.productName,rev:0,qty:0,gp:0,records:0};
    prodMap[s.product].rev+=netSell(s)*s.qty;
    prodMap[s.product].qty+=Number(s.qty);
    prodMap[s.product].gp+=gpAmt(s);
    prodMap[s.product].records++;
  });
  const ranking=Object.values(prodMap).sort((a,b)=>b.rev-a.rev);
  const maxRev=ranking[0]?.rev||1;

  const presetBar=PRESETS.map(p=>`<button class="preset-btn ${state.dPreset===p.key?"active":"inactive"}" onclick="setDPreset('${p.key}')">${p.label}</button>`).join("");
  const customRow=state.dPreset==="custom"?`
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px">
      <span style="font-size:11px;color:var(--muted)">From</span>
      <input type="date" value="${state.dFrom}" onchange="state.dFrom=this.value;render()" style="width:140px">
      <span style="font-size:11px;color:var(--muted)">To</span>
      <input type="date" value="${state.dTo}" onchange="state.dTo=this.value;render()" style="width:140px">
    </div>`:"";
  const rangeLabel=state.dFrom||state.dTo?`<span style="font-size:11px;color:var(--cyan);margin-left:8px">${state.dFrom||"…"} → ${state.dTo||"…"}</span>`:"";
  const channelPills=`<button class="preset-btn ${state.dChannel===""?"active":"inactive"}" onclick="state.dChannel='';render()">All Channels</button>`+
    allChannels.map(ch=>`<button class="preset-btn ${state.dChannel===ch?"active":"inactive"}" onclick="state.dChannel='${ch.replace(/'/g,"\'")}';render()">${escH(ch)}</button>`).join("");

  return `
  <div class="grid" style="gap:14px">
    <!-- Date range + Channel filter -->
    <div class="card" style="display:grid;gap:10px">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span style="font-size:11px;font-weight:700;color:var(--muted)">📅 Date Range</span>
        <div class="preset-bar">${presetBar}</div>

      ${customRow}
      <div style="border-top:1px solid var(--border);padding-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">

        <div class="preset-bar">${channelPills}</div>
        ${state.dChannel?`<span style="font-size:11px;color:var(--cyan)">Filtered: ${escH(state.dChannel)}</span>`:""}
      </div>
    </div>

    ${noData?`<div class="card" style="text-align:center;color:var(--muted);padding:24px">No data for the selected date range</div>`:""}

    <!-- Date stats -->
    ${!noData?`
    <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px">📅 Date Statistics</div>
    <div class="grid g-auto">
      <div class="stat-card" style="border:1px solid #334155">
        <div class="stat-label">Date Range (days)</div>
        <div class="stat-value" style="color:var(--cyan)">${fmtNum(ds.days)}</div>
        <div class="stat-sub">${ds.firstDate||"—"} → ${ds.lastDate||"—"}</div>
      </div>
      <div class="stat-card" style="border:1px solid #334155">
        <div class="stat-label">Unique Sale Dates</div>
        <div class="stat-value" style="color:var(--blue)">${fmtNum(ds.uniqueDates)}</div>
        <div class="stat-sub">out of ${fmtNum(ds.days)} days</div>
      </div>
      <div class="stat-card" style="border:1px solid #334155">
        <div class="stat-label">Avg Revenue / Day</div>
        <div class="stat-value" style="color:var(--green)">${fmtB(ds.avgRevPerDay)}</div>
        <div class="stat-sub">based on range span</div>
      </div>
      <div class="stat-card" style="border:1px solid #334155">
        <div class="stat-label">Avg GP / Day</div>
        <div class="stat-value" style="color:#6ee7b7">${fmtB(ds.avgGPPerDay)}</div>
        <div class="stat-sub">gross profit per day</div>
      </div>
    </div>`:""}

    <!-- Sales KPIs -->
    <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px">📈 Sales Performance</div>
    <div class="grid g-auto">
      <div class="stat-card" style="border:1px solid var(--cyan);opacity:${noData?.5:1}"><div class="stat-label">Net Revenue</div><div class="stat-value" style="color:var(--cyan)">${fmtB(totRev)}</div></div>
      <div class="stat-card" style="border:1px solid var(--green);opacity:${noData?.5:1}"><div class="stat-label">Gross Profit</div><div class="stat-value" style="color:var(--green)">${fmtB(totGP)}</div><div class="stat-sub">Avg GP ${fmtPct(avgGP)}</div></div>
      <div class="stat-card" style="border:1px solid var(--amber);opacity:${noData?.5:1}"><div class="stat-label">Total Discount</div><div class="stat-value" style="color:var(--amber)">${fmtB(totDisc)}</div></div>
      <div class="stat-card" style="border:1px solid var(--purple);opacity:${noData?.5:1}"><div class="stat-label">Total Licensee Fee</div><div class="stat-value" style="color:var(--purple)">${fmtB(totLic)}</div></div>
    </div>

    <!-- Breakdown cards -->
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px">
      ${[{l:"Direct Sale",d:dirS,a:"#22d3ee"},{l:"Consignment",d:conS,a:"var(--amber)"},{l:"Retail",d:retS,a:"#c4b5fd"},{l:"Wholesale",d:whoS,a:"var(--blue)"}].map(({l,d,a})=>{
        const rev=d.reduce((a,s)=>a+netSell(s)*s.qty,0);
        const gp=d.reduce((a,s)=>a+gpAmt(s),0);
        const gpp=rev?(gp/rev)*100:0;
        return `<div class="card" style="border-left:4px solid ${a}">
          <div style="font-weight:700;color:${a};margin-bottom:8px">${l}</div>
          <div class="grid g2" style="gap:6px;font-size:12px">
            <div><div style="color:var(--muted);font-size:10px">Records</div><div style="font-weight:700">${d.length}</div></div>
            <div><div style="color:var(--muted);font-size:10px">Total Qty</div><div style="font-weight:700">${fmtNum(d.reduce((a,s)=>a+Number(s.qty),0))}</div></div>
            <div><div style="color:var(--muted);font-size:10px">Revenue</div><div style="font-weight:700">${fmtB(rev)}</div></div>
            <div><div style="color:var(--muted);font-size:10px">GP %</div><div style="font-weight:800;color:${gpp>=40?"#6ee7b7":gpp>=25?"#fde68a":"#fca5a5"}">${fmtPct(gpp)}</div></div>
          </div>
        </div>`;
      }).join("")}
    </div>

    <!-- GP by Channel + Stock Value -->
    <div class="grid g2">
      <div class="card">
        <div class="sec-title">GP by Channel</div>
        ${byCh.length===0?`<div style="color:var(--muted);font-size:12px">No data</div>`:`
        <table><thead><tr><th>Channel</th><th style="text-align:right">Net Revenue</th><th style="text-align:right">Disc</th><th style="text-align:right">Lic Fee</th><th style="text-align:right">GP %</th></tr></thead>
        <tbody>${byCh.map(r=>`<tr><td>${escH(r.ch)}</td>
          <td style="text-align:right;font-family:monospace">${fmtB(r.rev)}</td>
          <td style="text-align:right;font-family:monospace;color:var(--amber)">${fmtB(r.disc)}</td>
          <td style="text-align:right;font-family:monospace;color:var(--purple)">${fmtB(r.lic)}</td>
          <td style="text-align:right;font-family:monospace;font-weight:700" class="${gpClrClass(r.gpPct)}">${fmtPct(r.gpPct)}</td></tr>`).join("")}</tbody></table>`}
      </div>
      <div class="card">
        <div class="sec-title">Stock Balance &amp; Value</div>
        <table><thead><tr><th>Product</th><th style="text-align:right">Units</th><th style="text-align:right">Cost Val</th><th style="text-align:right">Retail Val</th><th style="text-align:right">Status</th></tr></thead>
        <tbody>${state.products.map(p=>{
          const b=Math.max(0,wh[p.id]||0);
          const cb=con[p.id]||0;
          const cv=b*Number(p.costPrice||0);
          const rv=b*Number(p.sellingPrice||0);
          const sc=b>50?"st-ok":b>10?"st-low":"st-crit";
          return `<tr><td><div style="font-weight:600;font-size:12px">${escH(p.name)}</div>${cb>0?`<div style="font-size:10px;color:var(--orange)">+${fmtNum(cb)} at consignee</div>`:""}</td>
            <td style="text-align:right;font-family:monospace;font-weight:700" class="${sc}">${fmtNum(b)}</td>
            <td style="text-align:right;font-family:monospace;font-size:12px;color:var(--amber)">${fmtB(cv)}</td>
            <td style="text-align:right;font-family:monospace;font-size:12px;color:var(--green)">${fmtB(rv)}</td>
            <td style="text-align:right;font-size:11px" class="${sc}">${b>50?"✓ OK":b>10?"⚠ Low":"⛔ Crit"}</td></tr>`;
        }).join("")}</tbody>
        <tfoot><tr style="border-top:2px solid var(--border)">
          <td style="color:var(--sub);font-size:11px">Total</td>
          <td style="text-align:right;font-family:monospace">${fmtNum(totUnits)}</td>
          <td style="text-align:right;font-family:monospace;color:var(--amber)">${fmtB(totCostVal)}</td>
          <td style="text-align:right;font-family:monospace;color:var(--green)">${fmtB(totRetailVal)}</td>
          <td></td>
        </tr></tfoot></table>
      </div>
    </div>

    <!-- Inventory KPIs -->
    <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px">📦 Inventory Value (All-Time)</div>
    <div class="grid g-auto">
      <div class="stat-card" style="border:1px solid var(--cyan)"><div class="stat-label">Total Units (Warehouse)</div><div class="stat-value" style="color:var(--cyan)">${fmtNum(totUnits)}</div></div>
      <div class="stat-card" style="border:1px solid var(--amber)"><div class="stat-label">Stock Cost Value</div><div class="stat-value" style="color:var(--amber)">${fmtB(totCostVal)}</div><div class="stat-sub">at cost price</div></div>
      <div class="stat-card" style="border:1px solid var(--green)"><div class="stat-label">Stock Retail Value</div><div class="stat-value" style="color:var(--green)">${fmtB(totRetailVal)}</div><div class="stat-sub">at selling price</div></div>
      <div class="stat-card" style="border:1px solid var(--orange)"><div class="stat-label">Units at Consignee</div><div class="stat-value" style="color:var(--orange)">${fmtNum(totConUnits)}</div><div class="stat-sub">CON-OUT balance</div></div>
    </div>

    <!-- Product ranking -->
    <div class="card">
      <div class="sec-title">🏆 Product Ranking — by Net Revenue</div>
      ${ranking.length===0?`<div style="color:var(--muted);font-size:12px">No sales data</div>`:`
      <table><thead><tr style="background:var(--bg)">

      </tr></thead><tbody>
      ${ranking.map((r,i)=>{
        const prod=state.products.find(p=>p.id===r.id)||{};
        const stk=Math.max(0,wh[r.id]||0);
        const cv=stk*Number(prod.costPrice||0);
        const rv=stk*Number(prod.sellingPrice||0);
        const gpp=r.rev?(r.gp/r.rev)*100:0;
        const medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":`#${i+1}`;
        const barW=Math.round((r.rev/maxRev)*100);
        return `<tr class="data-row">
          <td style="font-size:14px">${medal}</td>
          <td><div style="font-weight:700">${escH(r.name)}</div>
            <div class="bar-bg"><div class="bar-fill" style="width:${barW}%"></div></div>
          </td>
          <td style="text-align:right;font-family:monospace">${fmtNum(r.qty)}</td>
          <td style="text-align:right;font-family:monospace;font-weight:700;color:var(--cyan)">${fmtB(r.rev)}</td>
          <td style="text-align:right;font-family:monospace">${fmtB(r.gp)}</td>
          <td style="text-align:right;font-family:monospace;font-weight:700" class="${gpClrClass(gpp)}">${fmtPct(gpp)}</td>
          <td style="text-align:right;font-family:monospace" class="${stk>50?"st-ok":stk>10?"st-low":"st-crit"}">${fmtNum(stk)}</td>
          <td style="text-align:right;font-family:monospace;font-size:12px;color:var(--amber)">${fmtB(cv)}</td>
          <td style="text-align:right;font-family:monospace;font-size:12px;color:var(--green)">${fmtB(rv)}</td>
        </tr>`;
      }).join("")}
      </tbody><tfoot><tr style="border-top:2px solid var(--border);background:var(--bg)">
        <td colspan="2" style="color:var(--sub);font-size:11px">Total (${ranking.length} products)</td>
        <td style="text-align:right;font-family:monospace">${fmtNum(ranking.reduce((a,r)=>a+r.qty,0))}</td>
        <td style="text-align:right;font-family:monospace;color:var(--cyan)">${fmtB(ranking.reduce((a,r)=>a+r.rev,0))}</td>
        <td style="text-align:right;font-family:monospace;color:var(--green)">${fmtB(ranking.reduce((a,r)=>a+r.gp,0))}</td>
        <td colspan="4"></td>
      </tr></tfoot></table>`}
    </div>
  </div>`;
}

function renderSales(){
  const sf=state.sf;
  const fS=filteredSales(sf);
  const totQty=fS.reduce((a,r)=>a+Number(r.qty),0);
  const totRev=fS.reduce((a,r)=>a+netSell(r)*r.qty,0);
  const totGP =fS.reduce((a,r)=>a+gpAmt(r),0);
  const totDisc=fS.reduce((a,r)=>a+(r.sellingPrice-netSell(r))*r.qty,0);
  const totLic=fS.reduce((a,r)=>a+licFee(r)*r.qty,0);
  const avgGP=totRev?(totGP/totRev)*100:0;

  // date stats
  const ds=dateStats(fS);

  // pie data
  const byType={},byCh={},byProd={};
  fS.forEach((s,i)=>{
    const v=netSell(s)*s.qty;
    byType[s.type]=(byType[s.type]||0)+v;
    byCh[s.channel]=(byCh[s.channel]||0)+v;
    byProd[s.productName]=(byProd[s.productName]||0)+v;
  });
  const mkSlices=(obj)=>Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>({label:k,value:v,color:PIE_COLORS[i%PIE_COLORS.length]}));
  const slType=mkSlices(byType),slCh=mkSlices(byCh),slProd=mkSlices(byProd);

  const prodPills=`<button class="pill ${sf.product===""?"active":"inactive"}" onclick="setSF('product','')">All</button>`+
    state.products.map(p=>`<button class="pill ${sf.product===p.id?"active":"inactive"}" onclick="setSF('product','${p.id}')">${escH(p.name)}</button>`).join("");

  const rows=fS.map(row=>{

      <td style="text-align:right;font-family:monospace">${fmtNum(row.qty)}</td>
      <td style="text-align:right;font-family:monospace;font-size:12px">${fmtB(row.sellingPrice)}</td>
      <td style="text-align:right;font-family:monospace;color:${(row.discount||0)>0?"var(--amber)":"var(--muted)"}">${row.discount||0}%</td>
      <td style="text-align:right;font-family:monospace;font-weight:600">${fmtB(ns)}</td>
      <td style="text-align:right;font-family:monospace;color:${(row.licenseeFee||0)>0?"var(--purple)":"var(--muted)"}">${row.licenseeFee||0}%</td>
      <td style="text-align:right;font-family:monospace;font-weight:700">${fmtB(rev)}</td>
      <td style="text-align:right;font-family:monospace">${fmtB(gpB)}</td>
      <td style="text-align:right;font-family:monospace;font-weight:700" class="${gpClrClass(gp)}">${fmtPct(gp)}${row.gpOverride!=null&&row.gpOverride!==""?" ✏️":""}</td>
      <td style="font-size:11px;color:var(--muted)">${escH(row.ref||"")}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-ghost btn-sm" style="padding:3px 8px;margin-right:4px" onclick="editSale('${row.id}')">✏️</button>
        <button class="btn btn-danger btn-sm" style="padding:3px 8px" onclick="deleteSale('${row.id}')">🗑</button>
      </td>
    </tr>`;
  }).join("");

  return `
  <div class="grid" style="gap:12px">
    <!-- toolbar -->
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <div style="font-size:12px;color:var(--muted)">Showing <b style="color:var(--text)">${fS.length}</b> of ${state.sales.length} records</div>

            <button class="export-item" onclick="exportSummaryCSV()"><div style="font-weight:600">📊 Export summary (.csv)</div><div class="ei-sub">By product, totals</div></button>
            <button class="export-item" onclick="printReport()"><div style="font-weight:600">🖨️ Print / Save as PDF</div><div class="ei-sub">Formatted report with summary</div></button>

function openModal(type, opts={}){
  const overlay=document.getElementById("modal-overlay");
  const box=document.getElementById("modal-box");
  const title=document.getElementById("modal-title");
  const body=document.getElementById("modal-body");
  box.className="modal-box"+(type==="bulk"||type==="sheets"?" wide":"");
  overlay.style.display="flex";

  if(type==="sale"){
    const s=opts.id?state.sales.find(x=>x.id===opts.id):null;
    title.textContent=s?"✏️ Edit Sale":"➕ Add New Sale";
    body.innerHTML=saleForm(s);
  } else if(type==="stock"){
    title.textContent="📦 Add Stock Movement";
    body.innerHTML=stockForm();
  } else if(type==="product"){
    const p=opts.id?state.products.find(x=>x.id===opts.id):null;
    title.textContent=p?"✏️ Edit Product":"➕ Add New Product";
    body.innerHTML=productForm(p);
  } else if(type==="bulk"){
    title.textContent="⬆️ Bulk Import";
    body.innerHTML=bulkModal();
    attachBulkEvents();
  } else if(type==="sheets"){
    title.textContent="🔌 Connect Google Sheets";
    body.innerHTML=sheetsForm();
  }
}

function closeModal(){ document.getElementById("modal-overlay").style.display="none"; }

function updateSaleCalc(){
  const qty=Number(document.getElementById("f-qty")?.value||0);
  const sell=Number(document.getElementById("f-sell")?.value||0);
  const cost=Number(document.getElementById("f-cost")?.value||0);
  const disc=Number(document.getElementById("f-disc")?.value||0);
  const lic=Number(document.getElementById("f-lic")?.value||0);
  const gpOv=document.getElementById("f-gp")?.value;
  if(!qty||!sell) return;
  const ns=sell*(1-disc/100);
  const lf=ns*lic/100;
  const gp=gpOv!=""?Number(gpOv):((ns-cost-lf)/ns)*100;
  const box=document.getElementById("sale-calc");
  box.style.display="block";
  document.getElementById("calc-rev").textContent=fmtB(ns*qty);
  document.getElementById("calc-disc").textContent=fmtB((sell-ns)*qty);
  document.getElementById("calc-lic").textContent=fmtB(lf*qty);
  const gpEl=document.getElementById("calc-gp");
  gpEl.textContent=fmtPct(gp);
  gpEl.className=gpClrClass(gp);
}

function handleProductImageFile(inp){

function previewProductImageUrl(url){

let bulkTab="sales", bulkMode="append", bulkRows=null;

function switchBulkTab(tab){
  bulkTab=tab;
  const descs={sales:"Import sales records — type, discount, licensee fee, channel",stock:"Import stock movements — IN / OUT / CON-OUT / CON-RETURN etc.",products:"Import or update product master data"};
  document.getElementById("bulk-desc").textContent=descs[tab];
  const colors={sales:"#f59e0b",stock:"var(--cyan)",products:"#c4b5fd"};
  ["sales","stock","products"].forEach(k=>{
    const btn=document.getElementById("btab-"+k);
    if(btn){btn.style.background=k===tab?colors[k]+"22":"transparent";btn.style.color=k===tab?colors[k]:"var(--muted)";}
  });
  clearBulk();
}

function setBulkMode(mode){
  bulkMode=mode;
  document.getElementById("bmode-append").className="btn btn-sm "+(mode==="append"?"btn-primary":"btn-ghost");
  document.getElementById("bmode-replace").className="btn btn-sm "+(mode==="replace"?"btn-warn":"btn-ghost");
}

function handleBulkFile(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();r.onload=e=>processBulkText(e.target.result);r.readAsText(f,"UTF-8");
}

function processBulkText(text){
  document.getElementById("bulk-paste").value=text;
  try{
    const raw=parseCSV(text);
    const errs=[];
    const mapped=raw.map((r,i)=>{
      let row;
      if(bulkTab==="sales"){
        row={id:"",date:r.date||todayStr(),product:r.product_id||r.product||"",productName:r.product_name||r.product||"",
          type:r.type||"Direct Sale",salesType:r.sales_type||"Retail",
          qty:Number(r.qty||0),costPrice:Number(r.cost_price||0),sellingPrice:Number(r.selling_price||0),
          discount:Number(r.discount||0),licenseeFee:Number(r.licensee_fee||0),
          gpOverride:r.gp_override!=""&&r.gp_override?Number(r.gp_override):null,
          channel:r.channel||"",ref:r.ref||"",note:r.note||""};
        if(!row.product)errs.push(`Row ${i+2}: product_id required`);
        if(!row.qty||row.qty<=0)errs.push(`Row ${i+2}: qty must be > 0`);
        if(!row.sellingPrice)errs.push(`Row ${i+2}: selling_price required`);
        if(!row.channel)errs.push(`Row ${i+2}: channel required`);
      } else if(bulkTab==="stock"){
        row={id:"",date:r.date||todayStr(),product:r.product_id||r.product||"",
          productName:r.product_name||r.productname||state.products.find(p=>p.id===(r.product_id||r.product))?.name||r.product||"",
          movement:(r.movement||"IN").toUpperCase(),qty:Number(r.qty||0),ref:r.ref||"",note:r.note||"",periodEnd:r.period_end||""};
        if(!row.product)errs.push(`Row ${i+2}: product_id required`);
        if(!row.qty||row.qty<=0)errs.push(`Row ${i+2}: qty must be > 0`);
        if(!MV_ALL.includes(row.movement))errs.push(`Row ${i+2}: movement must be ${MV_ALL.join("/")}`);
      } else {
        row={id:r.id||"",name:r.name||"",sku:r.sku||"",unit:r.unit||"",costPrice:Number(r.cost_price||0),sellingPrice:Number(r.selling_price||0)};
        if(!row.id)errs.push(`Row ${i+2}: id required`);
        if(!row.name)errs.push(`Row ${i+2}: name required`);
      }
      return row;
    });
    bulkRows=mapped;
    showBulkErrors(errs);
    showBulkPreview(mapped);
  } catch(e){showBulkErrors(["Cannot parse CSV: "+e.message]);bulkRows=null;}
}

function showBulkErrors(errs){
  const el=document.getElementById("bulk-errors");
  if(!errs.length){el.style.display="none";return;}
  el.style.display="block";
  el.innerHTML=`<div style="background:#7f1d1d22;border:1px solid #7f1d1d55;border-radius:8px;padding:12px;margin-top:8px;max-height:120px;overflow-y:auto">
    <div style="color:var(--red-txt);font-weight:700;margin-bottom:6px">⚠️ ${errs.length} issue(s) — valid rows will still import</div>
    ${errs.map(e=>`<div style="font-size:12px;color:var(--red-txt);margin-bottom:2px">• ${escH(e)}</div>`).join("")}
  </div>`;
}

function showBulkPreview(rows){
  const el=document.getElementById("bulk-preview");
  if(!rows||!rows.length){el.style.display="none";return;}
  el.style.display="block";
  let cols,rowHtml;
  if(bulkTab==="sales"){
    cols=["Date","Product","Type","Sales Type","Qty","Sell Price","Disc%","Lic%","Channel","Ref"];
    rowHtml=rows.map(r=>`<tr><td>${r.date}</td><td>${escH(r.productName)}</td>
      <td><span class="${tagClass(r.type)}">${r.type}</span></td>
      <td><span class="${tagClass(r.salesType||"Retail")}">${r.salesType||"Retail"}</span></td>
      <td style="text-align:right">${r.qty}</td><td style="text-align:right">${fmtB(r.sellingPrice)}</td>
      <td style="text-align:right">${r.discount||0}%</td><td style="text-align:right">${r.licenseeFee||0}%</td>
      <td>${escH(r.channel)}</td><td>${escH(r.ref)}</td></tr>`).join("");
  } else if(bulkTab==="stock"){
    cols=["Date","Product","Movement","Qty","Ref","Note","Period End"];
    rowHtml=rows.map(r=>`<tr><td>${r.date}</td><td>${escH(r.productName)}</td>
      <td><span class="${tagClass(r.movement)}">${r.movement}</span></td>
      <td style="text-align:right">${r.qty}</td><td>${escH(r.ref)}</td><td>${escH(r.note)}</td><td>${r.periodEnd||""}</td></tr>`).join("");
  } else {
    cols=["ID","Name","SKU","Unit","Cost Price","Selling Price"];
    rowHtml=rows.map(r=>`<tr><td style="font-family:monospace">${r.id}</td><td>${escH(r.name)}</td><td style="font-family:monospace">${r.sku}</td>
      <td>${r.unit}</td><td style="text-align:right">${fmtB(r.costPrice)}</td><td style="text-align:right">${fmtB(r.sellingPrice)}</td></tr>`).join("");
  }
  el.innerHTML=`
    <div style="margin-top:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-weight:700;color:var(--green-txt)">✓ ${rows.length} records ready</span>
        <span style="font-size:11px;color:${bulkMode==="replace"?"var(--red-txt)":"var(--green-txt)"}">${bulkMode==="replace"?"⚠️ Will REPLACE all existing":"Will append to existing"}</span>
      </div>
      <div class="scroll-preview">
        <table style="font-size:12px"><thead style="position:sticky;top:0;background:var(--bg)"><tr>${cols.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${rowHtml}</tbody></table>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn ${bulkMode==="replace"?"btn-warn":"btn-success"}" onclick="doImport()">
          ${bulkMode==="replace"?"⚠️ Replace All":"✅ Import"} (${rows.length})
        </button>
      </div>
    </div>`;
}

function clearBulk(){
  bulkRows=null;
  const el=document.getElementById("bulk-paste");if(el)el.value="";
  const fe=document.getElementById("bulk-errors");if(fe)fe.style.display="none";
  const fp=document.getElementById("bulk-preview");if(fp)fp.style.display="none";
}

function doImport(){
  if(!bulkRows||!bulkRows.length) return;
  if(bulkTab==="sales"){
    const add=bulkRows.map((r,i)=>({...r,id:"S"+String((bulkMode==="replace"?0:state.sales.length)+i+1).padStart(3,"0")}));
    state.sales=bulkMode==="replace"?add:[...state.sales,...add];
  } else if(bulkTab==="stock"){
    const add=bulkRows.map((r,i)=>({...r,id:"M"+String((bulkMode==="replace"?0:state.stock.length)+i+1).padStart(3,"0")}));
    state.stock=bulkMode==="replace"?add:[...state.stock,...add];
  } else {
    if(bulkMode==="replace"){state.products=bulkRows.filter(r=>r.id&&r.name);}
    else{
      const ex={};state.products.forEach(p=>{ex[p.id]=true;});
      const toAdd=bulkRows.filter(r=>r.id&&r.name&&!ex[r.id]);
      const toUpd=bulkRows.filter(r=>r.id&&r.name&&ex[r.id]);
      state.products=state.products.map(p=>{const u=toUpd.find(t=>t.id===p.id);return u?{...p,...u}:p;});
      state.products=[...state.products,...toAdd];
    }
  }
  closeModal();autoSave();render();
}

function attachBulkEvents(){
  const dz=document.getElementById("bulk-dz");
  if(dz){
    dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("drag");});
    dz.addEventListener("dragleave",()=>dz.classList.remove("drag"));
    dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("drag");
      const f=e.dataTransfer.files[0];if(!f)return;
      const r=new FileReader();r.onload=ev=>processBulkText(ev.target.result);r.readAsText(f,"UTF-8");
    });
  }
  const dlBtn=document.getElementById("dl-tmpl-btn");
  if(dlBtn) dlBtn.onclick=()=>{
    const tmpl=bulkTab==="sales"?TMPL_SALES:bulkTab==="stock"?TMPL_STOCK:TMPL_PRODUCTS;
    const b=new Blob([tmpl],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`MerchTrack_${bulkTab}_template.csv`;a.click();
  };
}

function downloadAppsScript(){
  const code=`// MerchTrack Google Apps Script
// Extensions → Apps Script → paste → Deploy as Web App (Execute as Me, Anyone)

function doGet(e) {
  const action = e.parameter.action || "read";
  const sheet  = e.parameter.sheet  || "Sales";
  if(action==="ping") {
    const sheets = SpreadsheetApp.getActiveSpreadsheet().getSheets().map(s=>s.getName());
    return json({status:"ok", sheets});
  }
  const sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(sheet);
  if(!sh) return json({error:"Sheet not found: "+sheet});
  return json({status:"ok", values: sh.getDataRange().getValues()});
}

function doPost(e) {
  const body = JSON.parse(e.postData.contents);
  const sheet = body.sheet || "Sales";
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sh = ss.getSheetByName(sheet) || ss.insertSheet(sheet);
  if(body.action==="write") {
    sh.clearContents();
    const vals = body.values;
    if(vals && vals.length>0)
      sh.getRange(1,1,vals.length,vals[0].length).setValues(vals);
    return json({status:"ok"});
  }
  return json({error:"Unknown action"});
}

function json(obj){
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}`;
  const b=new Blob([code],{type:"text/javascript"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="MerchTrack_AppsScript.js";a.click();
}

async function testSheets(){
  const url=document.getElementById("gs-url")?.value||"";
  const el=document.getElementById("gs-test-result");
  el.style.display="block";el.innerHTML=`<div style="color:var(--sub);font-size:12px">Testing…</div>`;

    if(j.status==="ok") el.innerHTML=`<div style="background:var(--green-dim);border:1px solid #064e3b;border-radius:7px;padding:10px;font-size:12px;color:var(--green-txt)">✓ Connected! Sheets: ${j.sheets.join(", ")}</div>`;
    else el.innerHTML=`<div style="background:var(--red-dim);border:1px solid #7f1d1d;border-radius:7px;padding:10px;font-size:12px;color:var(--red-txt)">✗ ${escH(j.error)}</div>`;
  } catch(e){el.innerHTML=`<div style="background:var(--red-dim);border:1px solid #7f1d1d;border-radius:7px;padding:10px;font-size:12px;color:var(--red-txt)">✗ Cannot reach URL: ${escH(e.message)}</div>`;}
}

function saveSheets(){
  const url=document.getElementById("gs-url")?.value||"";
  state.gsUrl=url;localStorage.setItem("mt_gs_url",url);
  closeModal();if(url)loadFromSheets();else render();
}

const SALE_HDR=["id","date","product","productName","type","salesType","qty","costPrice","sellingPrice","discount","licenseeFee","gpOverride","channel","ref","note"];
const STOCK_HDR=["id","date","product","productName","movement","qty","ref","note","periodEnd"];
const PROD_HDR=["id","name","sku","unit","costPrice","sellingPrice","imageUrl"];

async function loadFromSheets(){
  if(!state.gsUrl) return;
  state.gsStatus="loading";state.gsMsg="";renderHeader();
  try{
    const [rP,rS,rM]=await Promise.all([
      fetch(state.gsUrl+"?action=read&sheet=Products").then(r=>r.json()),
      fetch(state.gsUrl+"?action=read&sheet=Sales").then(r=>r.json()),
      fetch(state.gsUrl+"?action=read&sheet=Stock").then(r=>r.json()),
    ]);
    const toRows=(vals,parse)=>{
      if(!vals||vals.length<2) return [];
      const hdrs=vals[0].map(h=>String(h).trim());
      return vals.slice(1).filter(r=>r.some(c=>c!=="")).map(row=>{
        const obj={};hdrs.forEach((h,i)=>{obj[h]=row[i]||"";});
        return parse(obj);
      }).filter(r=>r.id);
    };
    if(rP.values) state.products=toRows(rP.values,r=>({id:r.id||"",name:r.name||"",sku:r.sku||"",unit:r.unit||"",costPrice:Number(r.costPrice||0),sellingPrice:Number(r.sellingPrice||0),imageUrl:r.imageUrl||""}));
    if(rS.values) state.sales=toRows(rS.values,r=>({...r,qty:Number(r.qty||0),costPrice:Number(r.costPrice||0),sellingPrice:Number(r.sellingPrice||0),discount:Number(r.discount||0),licenseeFee:Number(r.licenseeFee||0),gpOverride:r.gpOverride!=""&&r.gpOverride?Number(r.gpOverride):null}));
    if(rM.values) state.stock=toRows(rM.values,r=>({...r,qty:Number(r.qty||0)}));
    state.gsStatus="ok";state.gsMsg=new Date().toLocaleTimeString();
  } catch(e){state.gsStatus="error";state.gsMsg=e.message;}
  render();
}

let saveTimer=null;
function autoSave(){
  if(!state.gsUrl) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    state.gsStatus="saving";renderHeader();
    try{
      const toVals=(hdrs,rows)=>[hdrs,...rows.map(r=>hdrs.map(h=>r[h]!=null?r[h]:""))];
      await Promise.all([
        fetch(state.gsUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"write",sheet:"Products",values:toVals(PROD_HDR,state.products)})}),
        fetch(state.gsUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"write",sheet:"Sales",values:toVals(SALE_HDR,state.sales)})}),
        fetch(state.gsUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"write",sheet:"Stock",values:toVals(STOCK_HDR,state.stock)})}),
      ]);
      state.gsStatus="ok";state.gsMsg=new Date().toLocaleTimeString();
    } catch(e){state.gsStatus="error";state.gsMsg=e.message;}
    renderHeader();
  },1500);
}

═══════════════════════════════════════════ */
function saveSale(existingId){
  const g=id=>document.getElementById(id)?.value||"";
  const gn=id=>Number(document.getElementById(id)?.value||0);
  const prod=state.products.find(p=>p.id===g("f-product"));
  const row={
    id:existingId||uid("S",state.sales),
    date:g("f-date"),product:g("f-product"),productName:prod?.name||"",
    type:g("f-type"),salesType:g("f-salesType"),
    qty:gn("f-qty"),costPrice:gn("f-cost"),sellingPrice:gn("f-sell"),
    discount:gn("f-disc"),licenseeFee:gn("f-lic"),
    gpOverride:g("f-gp")!==""?Number(g("f-gp")):null,
    channel:g("f-channel"),ref:g("f-ref"),note:g("f-note"),
  };
  if(!row.product||!row.qty||!row.sellingPrice||!row.channel){alert("Please fill required fields: Product, Qty, Selling Price, Channel");return;}
  if(existingId) state.sales=state.sales.map(s=>s.id===existingId?row:s);
  else state.sales=[...state.sales,row];
  closeModal();autoSave();render();
}

function saveStock(){
  const g=id=>document.getElementById(id)?.value||"";
  const prod=state.products.find(p=>p.id===g("f-product"));
  const row={
    id:uid("M",state.stock),date:g("f-date"),
    product:g("f-product"),productName:prod?.name||"",
    movement:g("f-mv"),qty:Number(g("f-qty")||0),
    ref:g("f-ref"),note:g("f-note"),periodEnd:g("f-period")||"",
  };
  if(!row.product||!row.qty){alert("Please fill required fields: Product and Qty");return;}
  state.stock=[...state.stock,row];
  closeModal();autoSave();render();
}

function saveProduct(existingId){
  const g=id=>document.getElementById(id)?.value||"";
  const row={id:g("f-id"),name:g("f-name"),sku:g("f-sku"),unit:g("f-unit"),costPrice:Number(g("f-cost")||0),sellingPrice:Number(g("f-sell")||0),imageUrl:g("f-img-url")||""};
  if(!row.id||!row.name||!row.sku||!row.unit){alert("Please fill required fields");return;}
  if(existingId) state.products=state.products.map(p=>p.id===existingId?row:p);
  else{
    if(state.products.find(p=>p.id===row.id)){alert("Product ID already exists");return;}
    state.products=[...state.products,row];
  }
  closeModal();autoSave();render();
}

function editSale(id){openModal("sale",{id});}
function editProduct(id){openModal("product",{id});}
function deleteSale(id){if(confirm("Delete this sale record?")){state.sales=state.sales.filter(s=>s.id!==id);autoSave();render();}}
function deleteProduct(id){if(confirm("Delete this product?")){state.products=state.products.filter(p=>p.id!==id);autoSave();render();}}

function exportRawCSV(){
  const fS=filteredSales(state.sf);
  const hdrs=["ID","Date","Product","Sale Type","Sales Type","Channel","Qty","Selling Price","Disc%","Net Price","Lic Fee%","Revenue","GP ฿","GP%","Ref","Note"];
  const rows=fS.map(r=>{const ns=netSell(r),gp=calcGP(r);
    return[r.id,r.date,r.productName,r.type,r.salesType||"Retail",r.channel,r.qty,r.sellingPrice,
      (r.discount||0)+"%",ns.toFixed(2),(r.licenseeFee||0)+"%",(ns*r.qty).toFixed(2),gpAmt(r).toFixed(2),gp.toFixed(2)+"%",r.ref||"",r.note||""];});
  downloadCSV(hdrs,rows,"MerchTrack_Sales");
}

function exportSummaryCSV(){
  const fS=filteredSales(state.sf);
  const m={};
  fS.forEach(r=>{if(!m[r.productName])m[r.productName]={name:r.productName,qty:0,rev:0,gp:0,disc:0,lic:0,records:0};
    m[r.productName].qty+=Number(r.qty);m[r.productName].rev+=netSell(r)*r.qty;
    m[r.productName].gp+=gpAmt(r);m[r.productName].disc+=(r.sellingPrice-netSell(r))*r.qty;
    m[r.productName].lic+=licFee(r)*r.qty;m[r.productName].records++;});
  const hdrs=["Product","Records","Qty","Net Revenue","GP ฿","GP%","Discount ฿","Licensee Fee ฿"];
  const rows=Object.values(m).sort((a,b)=>b.rev-a.rev).map(r=>[r.name,r.records,r.qty,r.rev.toFixed(2),r.gp.toFixed(2),(r.rev?(r.gp/r.rev)*100:0).toFixed(2)+"%",r.disc.toFixed(2),r.lic.toFixed(2)]);
  downloadCSV(hdrs,rows,"MerchTrack_Summary");
}

function downloadCSV(hdrs,rows,name){
  const csv=[hdrs,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const b=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`${name}_${todayStr()}.csv`;a.click();
}
